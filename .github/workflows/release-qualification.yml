name: Release Qualification

on:
  workflow_dispatch:

jobs:
  native-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Windows Clang C11 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/generate_empty_pack.py --check
      - run: python tools/build_m2_fixture.py --check
      - run: python tools/generate_m2_malformed.py --check
      - run: python tools/build_m3_model_fixture.py --check
      - run: python tools/generate_m3_malformed.py --check
      - run: python tools/build_unicode17_pack.py --check
      - run: python tools/generate_unicode17_malformed.py --check
      - run: python tools/validate_m2_fixture.py
      - run: python tools/validate_path_order.py
      - run: python tools/validate_manifest_identity.py
      - run: python tools/validate_m3_model.py
      - run: python tools/validate_unicode17.py
      - run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DMOSAIC_BUILD_TRUST=OFF -DCMAKE_DISABLE_FIND_PACKAGE_ICU=ON
      - run: cmake --build build/cmake --config Release
      - run: ctest --test-dir build/cmake -C Release --output-on-failure

  native-linux-deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/qualify_native.py
      - name: Reliability release campaign
        run: python tools/reliability_campaign.py --tier release --output build/reliability/release.json
      - run: python tools/build_release.py --no-build
      - run: python tools/validate_release_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-tokenizer-linux-x86_64
          path: dist/*.tar.gz

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p mosaic-core --no-default-features
      - run: python tools/validate_rust_structure.py
