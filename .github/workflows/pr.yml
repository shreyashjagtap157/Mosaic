name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Windows Clang C11 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/set_version.py --check
      - run: python tools/generate_artifact_checksums.py --check
      - run: python tools/generate_empty_pack.py --check
      - run: python tools/build_m2_fixture.py --check
      - run: python tools/build_m3_model_fixture.py --check
      - run: python tools/build_unicode17_pack.py --check
      - run: python tools/validate_m2_fixture.py
      - run: python tools/validate_path_order.py
      - run: python tools/validate_manifest_identity.py
      - run: python tools/abi_contract.py
      - run: python tools/validate_format_contract.py
      - run: python tools/validate_m3_model.py
      - run: python tools/validate_unicode17.py
      - run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DMOSAIC_BUILD_TRUST=OFF -DCMAKE_DISABLE_FIND_PACKAGE_ICU=ON
      - run: cmake --build build/cmake --config Release
      - run: ctest --test-dir build/cmake -C Release --output-on-failure
      - run: python tools/validate_mosaicd.py --build-dir build/cmake
      - run: python tools/validate_registry_http.py
      - name: Reliability smoke
        if: runner.os == 'Linux'
        run: python tools/reliability_campaign.py --tier smoke --output build/reliability/pr-smoke.json

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p mosaic-core --no-default-features
      - run: python tools/validate_rust_structure.py
      - run: python tools/validate_repo.py
